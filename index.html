<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#547449">
  <title>Field Dice — Roll in the wild</title>
  <style>
    :root { color-scheme: light; --ink:#17251b; --muted:#647260; --cream:#f4f2e8; --moss:#31583a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#718b55; }
    .field { min-height:100vh; position:relative; overflow:hidden; isolation:isolate; background: radial-gradient(ellipse at 50% 34%, #9db979 0%, #779655 47%, #587a48 100%); }
    .field::before,.field::after { content:""; position:absolute; inset:0; z-index:-1; pointer-events:none; }
    .field::before { opacity:.23; background-image: repeating-linear-gradient(13deg, transparent 0 16px, rgba(244,239,202,.13) 17px, transparent 18px 36px), repeating-linear-gradient(102deg, transparent 0 22px, rgba(32,71,38,.18) 23px, transparent 25px 49px); }
    .field::after { background:linear-gradient(180deg,rgba(19,38,21,.08),transparent 18%,transparent 80%,rgba(18,42,22,.16)); }
    .app { width:min(1420px,100%); min-height:100vh; margin:auto; padding:28px clamp(18px,4vw,58px) 34px; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; color:#f6f4e9; padding:0 7px 18px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { width:39px; height:39px; border:1px solid rgba(255,255,255,.55); border-radius:50%; display:grid; place-items:center; font-size:20px; background:rgba(20,39,22,.16); }
    .brand-name { font-weight:750; font-size:15px; letter-spacing:.13em; text-transform:uppercase; }
    .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:.18em; opacity:.82; }
    main { flex:1; display:grid; grid-template-columns:minmax(0,1.65fr) minmax(310px,.78fr); gap:clamp(25px,5vw,74px); align-items:center; }
    .arena-column { min-width:0; }
    .arena-heading { display:flex; align-items:end; justify-content:space-between; padding:0 8px; color:#f7f5e9; margin-bottom:2px; }
    h1 { font-family:Georgia, "Times New Roman", serif; font-size:clamp(26px,3.5vw,44px); line-height:1; font-weight:500; letter-spacing:-.035em; margin:0 0 8px; text-shadow:0 2px 16px #304d2c44; }
    .arena-hint { font-size:12px; opacity:.85; margin:0 0 7px; }
    .arena { position:relative; width:100%; aspect-ratio:960 / 770; }
    .arena-art { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 25px 20px rgba(28,38,19,.36)); user-select:none; pointer-events:none; }
    .dice-bed { position:absolute; left:17%; right:17%; top:21%; bottom:27%; }
    .rolled-die { position:absolute; width:clamp(67px,10.2vw,124px); aspect-ratio:1; display:grid; place-items:center; transform:translate(-50%,-50%); filter:drop-shadow(0 8px 6px rgba(25,24,18,.28)); }
    .rolled-die img { width:100%; height:100%; object-fit:contain; }
    .rolled-die .face-result { position:absolute; top:2%; right:1%; min-width:28px; height:28px; padding:0 7px; display:grid; place-items:center; border:2px solid rgba(255,255,255,.85); border-radius:50%; color:#fff; font-weight:850; font-size:13px; background:#1c241f; box-shadow:0 2px 8px #0007; opacity:0; transform:scale(.6); transition:opacity .25s ease,transform .25s ease; }
    .rolled-die.done .face-result { opacity:1; transform:scale(1); }
    .rolled-die.rolling { animation:tumble var(--duration) cubic-bezier(.15,.8,.25,1) both; animation-delay:var(--delay); }
    @keyframes tumble {
      0% { left:var(--from-x); top:var(--from-y); transform:translate(-50%,-50%) rotate(0) scale(.78); }
      16% { left:var(--hop-x); top:calc(var(--from-y) - 9%); transform:translate(-50%,-50%) rotate(210deg) scale(1.12); }
      43% { left:var(--mid-x); top:var(--mid-y); transform:translate(-50%,-50%) rotate(610deg) scale(.92); }
      68% { left:var(--end-x); top:calc(var(--end-y) - 6%); transform:translate(-50%,-50%) rotate(980deg) scale(1.08); }
      84% { left:var(--end-x); top:var(--end-y); transform:translate(-50%,-50%) rotate(1160deg) scale(.97); }
      92% { left:var(--end-x); top:calc(var(--end-y) - 2%); transform:translate(-50%,-50%) rotate(1200deg) scale(1.02); }
      100% { left:var(--end-x); top:var(--end-y); transform:translate(-50%,-50%) rotate(1200deg) scale(1); }
    }
    .empty-note { position:absolute; inset:0; display:grid; place-items:center; color:#fff9; font-family:Georgia,serif; font-style:italic; font-size:clamp(15px,1.8vw,20px); text-shadow:0 1px 5px #281e14; transition:opacity .2s; }
    .empty-note.hidden { opacity:0; }
    .controls { color:#f7f5e9; padding:20px 0; }
    .controls h2 { font-family:Georgia,serif; font-weight:500; font-size:30px; letter-spacing:-.025em; margin:0 0 6px; }
    .controls-intro { color:#f7f5e9cf; font-size:13px; margin:0 0 22px; }
    .dice-list { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
    .die-choice { appearance:none; border:1px solid rgba(255,255,255,.27); background:rgba(244,242,232,.14); color:#fff; border-radius:15px; padding:8px 5px 9px; min-width:0; cursor:pointer; text-align:center; transition:transform .18s,background .18s,border-color .18s,box-shadow .18s; }
    .die-choice:hover { transform:translateY(-3px); background:rgba(255,255,255,.24); }
    .die-choice:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    .die-choice.selected { background:rgba(250,248,237,.92); border-color:#fff; color:#203b28; box-shadow:0 5px 18px #192d1d44, inset 0 0 0 1px rgba(45,81,51,.12); transform:translateY(-3px); }
    .die-choice img { display:block; width:100%; aspect-ratio:1; object-fit:contain; }
    .die-name { display:block; font-size:12px; line-height:1.2; font-weight:750; margin-top:2px; }
    .die-range { display:block; font-size:10px; opacity:.76; margin-top:2px; }
    .selection-summary { display:flex; justify-content:space-between; align-items:center; min-height:30px; color:#f7f5e9d9; font-size:12px; margin:16px 1px 12px; }
    .selection-count { font-variant-numeric:tabular-nums; }
    .go-wrap { display:flex; justify-content:center; margin:6px 0 18px; }
    .go { appearance:none; width:106px; height:106px; border:2px solid rgba(255,255,255,.74); outline:5px solid rgba(17,32,20,.14); border-radius:50%; display:grid; place-items:center; background:#171a18; color:#fff; font-size:19px; font-weight:850; letter-spacing:.15em; cursor:pointer; box-shadow:0 10px 23px #172a1c55, inset 0 1px 1px #ffffff26; transition:transform .16s,box-shadow .16s,background .16s; }
    .go:hover:not(:disabled) { transform:scale(1.06); box-shadow:0 13px 28px #172a1c77, inset 0 1px 1px #ffffff26; background:#080a09; }
    .go:active:not(:disabled) { transform:scale(.97); }
    .go:focus-visible { outline:3px solid #fff; outline-offset:6px; }
    .go:disabled { opacity:.54; cursor:not-allowed; }
    .results { min-height:51px; display:flex; flex-wrap:wrap; justify-content:center; gap:7px; }
    .result-chip { border:1px solid #ffffff61; border-radius:999px; padding:6px 10px; background:#273a2c4f; font-size:11px; color:#fff; animation:chip-in .35s both; }
    .result-chip strong { font-size:13px; margin-left:4px; }
    @keyframes chip-in { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    footer { text-align:center; color:#f6f4e9a8; font-size:10px; letter-spacing:.15em; text-transform:uppercase; padding-top:7px; }
    @media (min-width:1200px) { .arena { max-height:calc(100vh - 165px); } }
    @media (max-width:820px) { .app { padding:18px 20px 20px; } main { grid-template-columns:minmax(0,1.25fr) minmax(270px,.85fr); gap:20px; } .controls h2{font-size:27px} .dice-list{gap:5px}.die-choice{border-radius:12px;padding:6px 3px 8px}.die-name{font-size:10px}.die-range{font-size:9px} }
    @media (max-width:650px) { .app{padding:15px 15px 18px} header{padding:0 3px 12px}.eyebrow{font-size:9px} main{display:flex;flex-direction:column;gap:0;justify-content:center}.arena-column{width:min(100%,590px)}.arena-heading{margin-bottom:0}h1{font-size:32px}.arena-hint{font-size:11px}.arena{width:100%}.rolled-die{width:clamp(65px,17vw,108px)}.controls{width:min(100%,520px);padding:0 3px 10px}.controls h2{font-size:28px}.controls-intro{margin-bottom:14px}.dice-list{gap:9px}.die-choice{padding:7px 5px 9px}.die-name{font-size:12px}.die-range{font-size:10px}.selection-summary{margin:11px 1px 6px}.go-wrap{margin:5px 0 10px}.go{width:88px;height:88px;font-size:17px}.results{min-height:35px}footer{padding-top:9px} }
    @media (max-width:390px) { .app{padding-left:11px;padding-right:11px}.die-choice{padding:6px 2px 7px}.die-name{font-size:11px}.die-range{font-size:9px}.arena-hint{max-width:115px;text-align:right} }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important} }
  </style>
</head>
<body>
  <div class="field">
    <div class="app">
      <header>
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span class="brand-name">Field Dice</span></div>
        <div class="eyebrow">A little luck in the open air</div>
      </header>
      <main>
        <section class="arena-column" aria-label="Dice arena">
          <div class="arena-heading"><div><h1>Roll in the wild.</h1><p class="arena-hint">Your stones are waiting in the arena.</p></div><span class="eyebrow">The stone circle</span></div>
          <div class="arena" id="arena">
            <img class="arena-art" src="arena_octagonal.png" alt="Octagonal stone dice arena">
            <div class="dice-bed" id="diceBed" aria-live="polite"><div class="empty-note" id="emptyNote">Choose your dice, then let them fly.</div></div>
          </div>
        </section>
        <section class="controls" aria-label="Dice controls">
          <h2>Choose your dice</h2>
          <p class="controls-intro">Pick one or build a handful. Your call.</p>
          <div class="dice-list" id="diceList" aria-label="Available dice"></div>
          <div class="selection-summary"><span id="selectionText">Choose any dice to begin</span><span class="selection-count" id="selectionCount">0 / 5</span></div>
          <div class="go-wrap"><button class="go" id="go" type="button" disabled aria-label="Roll selected dice">GO</button></div>
          <div class="results" id="results" aria-live="polite"></div>
        </section>
      </main>
      <footer>Made for a roll of the dice</footer>
    </div>
  </div>
  <script>
    (() => {
      const dice = [
        { id:'d6', name:'D6', range:6, color:'blue', src:'d6_blue.png' },
        { id:'d8', name:'D8', range:8, color:'red', src:'d8_red.png' },
        { id:'d10', name:'D10', range:10, color:'green', src:'d10_green.png' },
        { id:'d12', name:'D12', range:12, color:'yellow', src:'d12_yellow.png' },
        { id:'d20', name:'D20', range:20, color:'purple', src:'d20_purple.png' }
      ];
      const selected = new Set();
      const diceList = document.getElementById('diceList');
      const bed = document.getElementById('diceBed');
      const go = document.getElementById('go');
      const results = document.getElementById('results');
      const emptyNote = document.getElementById('emptyNote');
      let rolling = false;

      function renderChoices() {
        diceList.innerHTML = '';
        dice.forEach(die => {
          const button = document.createElement('button');
          button.type = 'button'; button.className = 'die-choice' + (selected.has(die.id) ? ' selected' : '');
          button.setAttribute('aria-pressed', String(selected.has(die.id)));
          button.setAttribute('aria-label', `${die.name}, ${selected.has(die.id) ? 'selected' : 'not selected'}`);
          button.innerHTML = `<img src="${die.src}" alt=""><span class="die-name">${die.name}</span><span class="die-range">1–${die.range}</span>`;
          button.addEventListener('click', () => choose(die.id));
          diceList.append(button);
        });
        document.getElementById('selectionCount').textContent = `${selected.size} / 5`;
        document.getElementById('selectionText').textContent = selected.size ? `${selected.size} ${selected.size === 1 ? 'die' : 'dice'} ready to roll` : 'Choose any dice to begin';
        go.disabled = rolling || selected.size === 0;
      }

      function choose(id) {
        if (rolling) return;
        // A click after a completed roll starts a completely fresh round.
        if (bed.querySelector('.rolled-die')) {
          bed.querySelectorAll('.rolled-die').forEach(node => node.remove());
          results.innerHTML = '';
          selected.clear();
          emptyNote.classList.remove('hidden');
          selected.add(id);
        } else if (selected.has(id)) selected.delete(id);
        else selected.add(id);
        renderChoices();
      }

      function randomDie(sides) {
        // Rejection sampling avoids modulo bias while using the browser's secure RNG.
        const ceiling = Math.floor(0x100000000 / sides) * sides;
        const word = new Uint32Array(1);
        do { crypto.getRandomValues(word); } while (word[0] >= ceiling);
        return (word[0] % sides) + 1;
      }

      function position(min, max) { return Math.round(min + Math.random() * (max - min)); }

      function roll() {
        if (rolling || selected.size === 0) return;
        rolling = true;
        results.innerHTML = '';
        emptyNote.classList.add('hidden');
        const batch = dice.filter(die => selected.has(die.id));
        // Fit a grid to the actual arena area and size dice to their cells. This keeps
        // the landing spots distinct even when five dice are rolled on a narrow screen.
        const bedWidth = bed.clientWidth, bedHeight = bed.clientHeight;
        const maxDieSize = window.matchMedia('(max-width: 650px)').matches
          ? Math.max(65, Math.min(window.innerWidth * .17, 108))
          : Math.max(67, Math.min(window.innerWidth * .102, 124));
        let layout = { cols:1, rows:batch.length, size:0 };
        for (let cols = 1; cols <= batch.length; cols++) {
          const rows = Math.ceil(batch.length / cols);
          const size = Math.min(maxDieSize, bedWidth / cols * .76, bedHeight / rows * .76);
          if (size > layout.size) layout = { cols, rows, size };
        }
        const landing = batch.map((_, index) => {
          const col = index % layout.cols, row = Math.floor(index / layout.cols);
          return {
            x: (col + .5) * 100 / layout.cols,
            y: (row + .5) * 100 / layout.rows
          };
        });
        batch.forEach((die, index) => {
          const node = document.createElement('div');
          node.className = 'rolled-die';
          node.style.width = `${layout.size}px`;
          node.setAttribute('aria-label', `${die.name} rolling`);
          const startX = position(30, 70), startY = position(35, 66), end = landing[index];
          const duration = 1.35 + Math.random() * .42;
          node.style.cssText = `--from-x:${startX}%;--from-y:${startY}%;--hop-x:${position(20,80)}%;--mid-x:${position(18,82)}%;--mid-y:${position(27,72)}%;--end-x:${end.x}%;--end-y:${end.y}%;--duration:${duration}s;--delay:${index * .035}s;z-index:${10 + index};`;
          const image = document.createElement('img'); image.src = die.src; image.alt = `${die.name} glass die`;
          const badge = document.createElement('span'); badge.className = 'face-result'; badge.textContent = randomDie(die.range);
          node.append(image,badge); bed.append(node);
          node.addEventListener('animationend', () => {
            // Keep the landing coordinates after removing the animation; otherwise
            // absolutely positioned dice revert to the same default location.
            node.style.left = `${end.x}%`;
            node.style.top = `${end.y}%`;
            node.classList.remove('rolling'); node.classList.add('done');
            node.setAttribute('aria-label', `${die.name} result ${badge.textContent}`);
            const chip = document.createElement('span'); chip.className = 'result-chip';
            chip.innerHTML = `${die.name}<strong>${badge.textContent}</strong>`;
            results.append(chip);
          }, { once:true });
          // Force layout so the animation reliably starts for every fresh roll.
          void node.offsetWidth;
          node.classList.add('rolling');
        });
        renderChoices();
        const finalDuration = Math.max(...batch.map((_,i) => 1.35 + .42 + i * .035)) * 1000 + 60;
        window.setTimeout(() => { rolling = false; renderChoices(); }, finalDuration);
      }

      go.addEventListener('click', roll);
      renderChoices();
    })();
  </script>
</body>
</html>
